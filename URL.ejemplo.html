<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario URL - CECyTEM</title>
</head>
<body>

    <h2>Soy CECyTEM y amo la economía</h2>
    <p>Ingresa tu página web favorita</p>

    <form action="#" method="POST">
        
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required><br><br>

        <label for="pagina">Tu página web (URL):</label><br>
        <input type="url" 
               id="pagina" 
               name="pagina" 
               placeholder="https://www.ejemplo.com" 
               required><br><br>

        <button type="submit">Guardar URL</button>
        <button type="reset">Borrar</button>

    </form>

</body>
</html>
